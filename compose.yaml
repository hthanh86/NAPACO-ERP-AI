name: napaco-local
services:
  mysql:
    image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: napaco-mysql84
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql84_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  backend: &qc_backend
    image: napaco-local-backend
    build: ./backend
    env_file:
      - path: .google.env
        required: false
    container_name: napaco-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:?}
      DB_USER: ${MYSQL_USER:?}
      DB_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - ./frontend:/app/frontend:ro
      - ./data:/app/data:ro
      - ./reports:/app/reports
      - qc_staging:/var/lib/napaco/qc-staging
  qc-worker:
    <<: *qc_backend
    container_name: napaco-qc-worker
    ports: []
    command: ["python", "-m", "app.modules.qc.worker"]
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/qc-worker-heartbeat')<240"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
volumes:
  mysql84_data:
  qc_staging:
