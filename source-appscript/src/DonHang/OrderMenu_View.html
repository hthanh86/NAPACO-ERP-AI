<style>
  body.erp-shell {
    --erp-sidebar-width: 224px;
    display: grid;
    grid-template-columns: var(--erp-sidebar-width) minmax(0, 1fr);
    min-height: 100vh;
    margin: 0;
    padding: 0;
    background: #f4f6fa;
  }

  .erp-sidebar {
    position: sticky;
    top: 0;
    z-index: 50;
    align-self: start;
    min-width: 0;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    padding: 20px 14px;
    background: #101b30;
    color: #e4eaf4;
    font: 500 14px system-ui, sans-serif;
  }

  .erp-sidebar *, .erp-sidebar *::before { box-sizing: border-box; }
  .erp-sidebar-top, .erp-identity { display: flex; align-items: center; gap: 10px; }
  .erp-sidebar-top { justify-content: space-between; margin: 0 3px 24px; }
  .erp-brand-mark {
    display: grid;
    place-items: center;
    flex: 0 0 35px;
    height: 35px;
    border-radius: 9px;
    background: #2663dd;
    color: #fff;
    font-size: 18px;
    font-weight: 750;
  }
  .erp-brand-name { display: block; color: #fff; font-size: 15px; font-weight: 750; }
  .erp-brand-caption { display: block; margin-top: 2px; color: #a9b8ce; font-size: 11px; }
  .erp-nav-group + .erp-nav-group { margin-top: 23px; }
  .erp-nav-label {
    margin: 0 10px 7px;
    color: #a9b8ce;
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .erp-sidebar .erp-module-link {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 38px;
    margin: 3px 0;
    padding: 7px 10px;
    border: 0;
    border-radius: 7px;
    color: #e4eaf4;
    text-decoration: none;
  }
  .erp-module-icon { flex: 0 0 19px; color: #a9b8ce; text-align: center; }
  .erp-sidebar a.erp-module-link:hover, .erp-sidebar .erp-submenu-toggle:hover { background: #213352; }
  .erp-sidebar .erp-submenu-toggle {
    list-style: none;
    cursor: pointer;
    font-weight: 700;
  }
  .erp-submenu-toggle::-webkit-details-marker { display: none; }
  .erp-submenu-chevron {
    width: 7px;
    height: 7px;
    margin: 0 3px 0 auto;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(-45deg);
  }
  .erp-submenu[open] .erp-submenu-chevron { transform: rotate(45deg); }
  .erp-submenu-links {
    margin-left: 19px;
    padding-left: 9px;
    border-left: 1px solid #405370;
  }
  .erp-sidebar a[aria-current="page"] { background: #244d9a; color: #fff; font-weight: 700; }
  .erp-sidebar a[aria-current="page"] .erp-module-icon { color: #fff; }
  .erp-sidebar [aria-disabled="true"] { color: #a9b8ce; }
  .erp-module-pending {
    margin-left: auto;
    color: #b8c6da;
    font-size: 9px;
    white-space: nowrap;
  }
  .erp-menu-toggle {
    display: none;
    border: 1px solid #526481;
    border-radius: 7px;
    padding: 7px 10px;
    background: transparent;
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  .erp-sidebar a:focus-visible, .erp-submenu-toggle:focus-visible, .erp-menu-toggle:focus-visible {
    outline: 2px solid #a6c8ff;
    outline-offset: 2px;
  }

  @media (max-width: 860px) {
    body.erp-shell { grid-template-columns: minmax(0, 1fr); }
    .erp-sidebar { height: auto; max-height: 65vh; padding: 10px 15px; }
    .erp-sidebar-top { margin: 0; }
    .erp-menu-toggle { display: block; }
    .erp-module-menu { display: none; padding-top: 15px; }
    .erp-sidebar[data-menu-open] .erp-module-menu { display: block; }
  }
</style>
<aside class="erp-sidebar" id="erpSidebar">
  <div class="erp-sidebar-top">
    <div class="erp-identity">
      <span class="erp-brand-mark" aria-hidden="true">N</span>
      <div>
        <span class="erp-brand-name">NAPACO ERP</span>
        <span class="erp-brand-caption">Điều hành sản xuất</span>
      </div>
    </div>
    <button type="button" class="erp-menu-toggle" id="erpMenuToggle"
      aria-expanded="false" aria-controls="erpModuleMenu">☰ Menu</button>
  </div>
  <nav class="erp-module-menu" id="erpModuleMenu" aria-label="Phân hệ">
    <? const groups = [...new Set(links.map(function(link) { return link.group; }))]; ?>
    <? groups.forEach(function(group) {
      const groupLinks = links.filter(function(link) { return link.group === group; });
      const menuParent = groupLinks.find(function(link) { return link.id === 'index'; }) ||
        (group === 'Nguyên Liệu' ? { icon: '▤', label: group } : null);
    ?>
      <div class="erp-nav-group">
        <? if (menuParent) { ?>
          <details class="erp-submenu" <? if (groupLinks.some(function(link) { return link.id === activeModule; })) { ?>open<? } ?>>
            <summary class="erp-module-link erp-submenu-toggle">
              <span class="erp-module-icon" aria-hidden="true"><?= menuParent.icon ?></span>
              <span><?= menuParent.label ?></span>
              <span class="erp-submenu-chevron" aria-hidden="true"></span>
            </summary>
            <div class="erp-submenu-links">
        <? } else { ?>
          <div class="erp-nav-label"><?= group ?></div>
        <? } ?>
        <? groupLinks.forEach(function(link) { ?>
          <? if (link.url) { ?>
            <a class="erp-module-link" href="<?= link.url ?>" <? if (link.id === activeModule) { ?>aria-current="page"<? } ?>>
              <span class="erp-module-icon" aria-hidden="true"><?= link.icon ?></span>
              <span><?= link.id === 'index' ? 'Tổng quan' : link.label ?></span>
            </a>
          <? } else { ?>
            <span class="erp-module-link" aria-disabled="true" title="Chưa cấu hình đường dẫn">
              <span class="erp-module-icon" aria-hidden="true"><?= link.icon ?></span>
              <span><?= link.label ?></span>
              <span class="erp-module-pending">Chờ liên kết</span>
            </span>
          <? } ?>
        <? }); ?>
        <? if (menuParent) { ?>
            </div>
          </details>
        <? } ?>
      </div>
    <? }); ?>
  </nav>
</aside>
<script>
  (() => {
    const sidebar = document.getElementById('erpSidebar');
    const toggle = document.getElementById('erpMenuToggle');
    toggle.addEventListener('click', () => {
      const open = sidebar.toggleAttribute('data-menu-open');
      toggle.setAttribute('aria-expanded', String(open));
    });
    sidebar.addEventListener('keydown', event => {
      if (event.key === 'Escape' && sidebar.hasAttribute('data-menu-open')) {
        sidebar.removeAttribute('data-menu-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.focus();
      }
    });
  })();
</script>
<style>
.erp-return-notice{position:fixed;top:0;left:var(--erp-sidebar-width,224px);right:0;z-index:1000;padding:12px 20px;background:#b91c1c;color:white;font:600 14px system-ui,sans-serif;box-shadow:0 2px 6px #0002}.erp-return-notice a{color:white;text-decoration:underline}body[data-return-notice] main{padding-top:80px}@media(max-width:860px){.erp-return-notice{left:0;position:sticky;grid-column:1}body[data-return-notice] main{padding-top:20px}}
</style>
<script>
(() => {
  let checking=false;
  function check(){
    if(checking || document.hidden)return;
    checking=true;
    google.script.run.withSuccessHandler(result=>{
      checking=false;
      let banner=document.getElementById('erpReturnNotice');
      if(!result.count){if(banner)banner.remove();document.body.removeAttribute('data-return-notice');return;}
      if(!banner){banner=document.createElement('div');banner.id='erpReturnNotice';banner.className='erp-return-notice';banner.setAttribute('role','alert');document.body.append(banner);}
      banner.replaceChildren();
      const text=document.createElement('span');text.textContent='Có '+result.count+' phiếu trả NVL chờ thủ kho xác nhận ('+Number(result.kg).toLocaleString('vi-VN')+' kg). ';banner.append(text);
      const link=document.createElement('a');link.href=<?!= JSON.stringify(appUrl + '?view=film-stock') ?>;link.textContent='Xem Tồn Kho';banner.append(link);
      document.body.setAttribute('data-return-notice','');
    }).withFailureHandler(()=>{checking=false}).getFilmPendingReturns();
  }
  check();setInterval(check,60000);document.addEventListener('visibilitychange',check);document.addEventListener('film-return-changed',check);
})();
</script>
